---
name: headscale-test

# Used by test/run.sh, not meant to be started by hand.

services:
  server:
    image: ${SERVER_IMAGE:-headscale-test:current}
    environment:
      - HEADSCALE_SERVER_URL=http://server:8080
      - HEADSCALE_BASE_DOMAIN=tn.example.test
      - REPLICA1_BUCKET=replica1
      - REPLICA1_ENDPOINT=http://minio:9000
      - REPLICA1_REGION=auto
      - REPLICA1_ACCESS_KEY_ID=keyid
      - REPLICA1_SECRET_ACCESS_KEY=secretkey
      - REPLICA2_BUCKET=replica2
      - REPLICA2_ENDPOINT=http://minio:9000
      - REPLICA2_REGION=auto
      - REPLICA2_ACCESS_KEY_ID=keyid
      - REPLICA2_SECRET_ACCESS_KEY=secretkey
    volumes:
      - headscale:/app/data
      - ./policy.json:/etc/headscale/policy.json:ro
    depends_on:
      minio:
        condition: service_healthy

  minio:
    image: registry.docker.com/bitnamilegacy/minio:latest
    environment:
      - MINIO_ROOT_USER=keyid
      - MINIO_ROOT_PASSWORD=secretkey
      - MINIO_DEFAULT_BUCKETS=replica1,replica2
    healthcheck:
      # MinIO reports live before it creates the buckets
      test: ["CMD", "mc", "ls", "local/replica2"]
      interval: 2s
      retries: 30

  node1: &node
    image: tailscale/tailscale:stable
    hostname: node1
    cap_add: [NET_ADMIN, NET_RAW]
    devices: [/dev/net/tun:/dev/net/tun]
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_AUTH_ONCE=true
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_EXTRA_ARGS=--login-server=http://server:8080 --ssh
    volumes:
      - node1:/var/lib/tailscale
    depends_on: [server]

  node2:
    <<: *node
    hostname: node2
    volumes:
      - node2:/var/lib/tailscale

  # joins after the upgrade, with a key created by the new version
  node3:
    <<: *node
    hostname: node3
    profiles: [late]
    environment:
      - TS_USERSPACE=false
      - TS_AUTHKEY=${TS_AUTHKEY_LATE:-}
      - TS_EXTRA_ARGS=--login-server=http://server:8080
    volumes: []

volumes:
  headscale:
  node1:
  node2:
